openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Business enquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createBusinessEnquiry
      tags: [enquiries]
      summary: Submit a business enquiry
      description: Stores a prospective customer's enquiry for the Velmax Technologies team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessEnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessEnquiryReceipt"
        "400":
          description: Invalid enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Enquiry could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BusinessEnquiryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        company:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 5
          maxLength: 32
        product:
          type: string
          enum:
            - servo-stabilizers
            - inverter-batteries
            - online-ups
            - general
        message:
          type: string
          minLength: 0
          maxLength: 5000
      required:
        - name
        - email
        - phone
        - product
        - message
    BusinessEnquiryReceipt:
      type: object
      properties:
        received:
          type: boolean
        message:
          type: string
      required:
        - received
        - message
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

